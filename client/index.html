<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Panjat Pinang Mayhem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --merah: #e31c25;
        --putih: #f7f3e8;
        --hijau: #1b7a4e;
        --langit: #7ec8e3;
        --tanah: #c4a574;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: linear-gradient(180deg, var(--langit) 0%, #b8e0d2 55%, var(--tanah) 100%);
        font-family: "Nunito", system-ui, sans-serif;
        color: #1a1a1a;
        touch-action: none;
      }
      #game-root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        touch-action: none;
      }
      #game-root canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: radial-gradient(circle at 30% 20%, #ff6b6b, #e31c25 55%, #7a0b12);
        color: white;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        padding: 2rem;
        padding-top: calc(2rem + var(--safe-top));
        padding-bottom: calc(2rem + var(--safe-bottom));
        font-family: "Fredoka", sans-serif;
      }
      #rotate-overlay.show {
        display: flex;
      }
      #rotate-overlay h1 {
        font-size: 1.8rem;
        margin: 0 0 0.5rem;
      }
      #rotate-overlay p {
        opacity: 0.9;
        max-width: 18rem;
      }
      .phone-icon {
        width: 64px;
        height: 100px;
        border: 4px solid white;
        border-radius: 10px;
        margin-bottom: 1.25rem;
        animation: tip 1.4s ease-in-out infinite;
      }
      @keyframes tip {
        0%,
        100% {
          transform: rotate(0deg);
        }
        40%,
        60% {
          transform: rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate-overlay">
      <div class="phone-icon"></div>
      <h1>Putar HP ke Landscape</h1>
      <p>Panjat Pinang Mayhem hanya bisa dimainkan dalam mode mendatar.</p>
    </div>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
